name: Feature Request
description: Suggest an improvement, job-board parser addition, or workflow refinement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What job-search workflow problem does this solve?
      description: Describe the pain point or goal for students and internship applicants.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it work while preserving offline-first privacy and zero runtime dependencies?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or references
      description: Any job boards, formats, or existing features to align with?
