name: Bug Report
description: Report a bug in the web app, browser extension, or local Java server
title: "[Bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: edition
    attributes:
      label: Where did this happen?
      options:
        - Website Edition (internshipnotebook.app / PWA)
        - Save Jobs Browser Extension (Chrome, Edge, Firefox)
        - Local Java Server Edition
        - Daily Openings Feed
        - Tests / Build Scripts
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Click...
        3. See error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, browser/version, viewport size (desktop vs mobile), and Java/Node version if local.
      placeholder: "macOS 15, Chrome 135, desktop or iPhone 390px"
